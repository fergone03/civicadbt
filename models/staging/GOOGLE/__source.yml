version: 2

sources:
  - name: GOOGLE
    database: DB20_BRONZE_DB
    schema: GOOGLE

    quoting:
      database: false
      schema: false
      identifier: false

    tables:
      - name: BUDGET
        config: 
          loaded_at_field: _fivetran_synced        
        columns:
          - name: _row
            tests:
              - unique
              - not_null
          - name: product_id
            tests:
              - relationships:
                  to: source('GOOGLE','products')
                  field: product_id
          - name: quantity
            tests:
              - positive_values
          - name: month
          - name: _fivetran_synced

      - name: USERS
        columns:
          - name: Nombre
          - name: DNI
          - name: email
          - name: fecha_alta_sistema